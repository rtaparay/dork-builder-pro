<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <title>dork-pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 7l4 5-4 5" />
            <path d="M13 17h6" />
          </svg>
        </span>
        <div style="min-width: 0">
          <h1>dork<b>-pro</b></h1>
          <div class="sub" data-i18n="reconocimiento · búsqueda avanzada">
            reconocimiento · búsqueda avanzada
          </div>
        </div>
      </div>
      <span class="divider"></span>
      <button
        class="icon-btn"
        id="homeBtn"
        data-i18n-title="Inicio"
        data-i18n-aria="Inicio"
        title="Inicio"
        aria-label="Inicio"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg>
      </button>
      <div class="topsearch">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.3-4.3" />
        </svg>
        <input
          id="globalSearch"
          type="search"
          placeholder="Buscar dork…"
          data-i18n-ph="Buscar dork…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <span class="top-spacer"></span>
      <button
        class="icon-btn lang-btn"
        id="langToggle"
        title="Cambiar idioma / Switch language"
        aria-label="Cambiar idioma / Switch language"
      >
        EN
      </button>
      <button
        class="icon-btn"
        id="themeToggle"
        data-i18n-title="Cambiar tema"
        data-i18n-aria="Cambiar tema"
        title="Cambiar tema"
        aria-label="Cambiar tema"
      >
        <svg
          id="themeIcon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" />
        </svg>
      </button>
    </header>

    <div class="shell home">
      <aside class="pane libs" aria-label="Bibliotecas">
        <div class="pane-h">
          <span class="ph-title" data-i18n="Bibliotecas">Bibliotecas</span>
        </div>
        <nav class="lib-list" id="libList"></nav>
      </aside>

      <section class="pane dorks" aria-label="Dorks">
        <div class="pane-h">
          <div class="filter-box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="M21 21l-4.3-4.3" />
            </svg>
            <input
              id="filter"
              type="search"
              placeholder="Filtrar comandos…"
              data-i18n-ph="Filtrar comandos…"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div
            class="sev-filter"
            id="sevFilter"
            role="group"
            aria-label="Severidad"
          >
            <button data-sev="all" aria-pressed="true" data-i18n="Todas">
              Todas
            </button>
            <button
              data-sev="alta"
              aria-pressed="false"
              style="color: var(--danger)"
            >
              <span class="fdot"></span><span data-i18n="Alto">Alto</span>
            </button>
            <button
              data-sev="media"
              aria-pressed="false"
              style="color: var(--warn)"
            >
              <span class="fdot"></span><span data-i18n="Medio">Medio</span>
            </button>
            <button
              data-sev="info"
              aria-pressed="false"
              style="color: var(--info)"
            >
              <span class="fdot"></span><span data-i18n="Info">Info</span>
            </button>
          </div>
        </div>
        <div class="dork-list" id="dorkList"></div>
      </section>

      <section class="pane detail" id="detail" aria-label="Detalle"></section>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/app.js"></script>
  </body>
</html>
